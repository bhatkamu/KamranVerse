<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0C" />
    <meta name="description" content="Kamu — 3D Creator & Software Engineer. Portfolio showcasing 3D modeling, rendering, motion design, branding, and web design work." />
    <title>Kamu -- 3D Creator</title>

    <!-- Prevent white flash before React mounts: set the dark background immediately -->
    <style>
      html, body, #root {
        background-color: #0C0C0C;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      #app-bootstrap-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0C0C0C;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-bootstrap-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-bootstrap-loader .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(215, 226, 234, 0.15);
        border-top-color: #D7E2EA;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }
      @keyframes app-bootstrap-spin { to { transform: rotate(360deg); } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-loader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
